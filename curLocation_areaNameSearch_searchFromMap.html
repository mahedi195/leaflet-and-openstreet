<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>leaflet open street map</title>


    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />


    <!-- Make sure you put this AFTER Leaflet's CSS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <style>
        #map {
            height: 550px;
        }
    </style>

</head>

<body>




    <div id="map"></div>

    <h1>Map</h1>




    <script>
        var map = L.map('map', {
            minZoom: 0,
            maxZoom: 19
        })
        map.setView([23.8103, 90.4125], 13);



        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);


        navigator.geolocation.watchPosition(success, error);

        let marker, circle, zoomed;

        function success(pos) {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;
            const accuracy = pos.coords.accuracy;

            if (marker) {
                marker.setLatLng([lat, lng]);
                circle.setLatLng([lat, lng]);
                circle.setRadius(accuracy);
            } else {
                marker = L.marker([lat, lng]).addTo(map);
                circle = L.circle([lat, lng], {
                    radius: accuracy
                }).addTo(map);
            }



            if (!zoomed) {
                map.fitBounds(circle.getBounds());
                zoomed = true;
            } else {
                map.panTo([lat, lng]);
            }


        }


        function error(err) {
            if (err.code == 1)
                alert('Please allow geolocation access');
            else
                alert("can't get current location");
        }



        // Click the map to select anyplace  road problem location
        var problemMarker;

        map.on('click', function (e) {
            const lat = e.latlng.lat;
            const lng = e.latlng.lng;

            if (problemMarker) {
                problemMarker.setLatLng([lat, lng]);
            } else {
                problemMarker = L.marker([lat, lng]).addTo(map);
            }

            problemMarker
                .bindPopup("Selected road problem location")
                .openPopup();

            console.log("Latitude:", lat);
            console.log("Longitude:", lng);
        });




        //area name search
        // Point 3: Search for an area or place
        async function searchLocation() {
            const query = document.getElementById('searchInput').value.trim();
            const resultsDiv = document.getElementById('searchResults');

            if (!query) {
                resultsDiv.textContent = "Please enter an area name.";
                return;
            }

            resultsDiv.textContent = "Searching...";

            try {
                const url =
                    "https://nominatim.openstreetmap.org/search?format=jsonv2&q=" +
                    encodeURIComponent(query + ", Bangladesh") +
                    "&countrycodes=bd&limit=5";

                const response = await fetch(url);
                const results = await response.json();

                resultsDiv.replaceChildren();

                if (results.length === 0) {
                    resultsDiv.textContent =
                        "No results found. Try another area name.";
                    return;
                }

                results.forEach(function (place) {
                    const button = document.createElement('button');

                    button.textContent = place.display_name;
                    button.style.display = "block";
                    button.style.margin = "5px 0";

                    button.onclick = function () {
                        const lat = Number(place.lat);
                        const lng = Number(place.lon);

                        map.setView([lat, lng], 17);

                        if (problemMarker) {
                            problemMarker.setLatLng([lat, lng]);
                        } else {
                            problemMarker = L.marker([lat, lng]).addTo(map);
                        }

                        problemMarker
                            .bindPopup("Selected road problem location")
                            .openPopup();

                        console.log("Latitude:", lat);
                        console.log("Longitude:", lng);
                    };

                    resultsDiv.appendChild(button);
                });

            } catch (error) {
                resultsDiv.textContent =
                    "Search failed. Please try again.";
                console.error(error);
            }
        }//



    </script>



</body>

</html>
